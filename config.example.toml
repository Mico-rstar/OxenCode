# OxenCode 配置示例
# 复制此文件到 ~/.oxencode/config.toml

# ====== Provider 配置 ======
# 可选值: anthropic, openai, azure, bedrock, google, openrouter, vercel, openaicompat
#          qwen, deepseek, glm
provider = "qwen"

# ====== API Key ======
# 大多数情况下可以通过环境变量设置，这里留空即可
# Anthropic: ANTHROPIC_API_KEY
# OpenAI: OPENAI_API_KEY
# Azure: AZURE_OPENAI_API_KEY
# Google: GOOGLE_API_KEY
# Qwen: DASHSCOPE_API_KEY
# DeepSeek: DEEPSEEK_API_KEY
# GLM: ZHIPU_API_KEY
api_key = "sk-8440a58764c846c88183bfec2d94d279"
# api_key = "sk-2021bc4319604c458a338eb9575246a1"

# ====== 模型配置 ======
# Anthropic Claude 模型
# claude-sonnet-4-5-20250514 (推荐)
# claude-sonnet-4-20250514
# claude-3-5-sonnet-20241022
# claude-3-5-haiku-20241022
# model = "qwen3-max"

# OpenAI 模型示例
# model = "gpt-4o"
# model = "gpt-4o-mini"
# model = "gpt-4-turbo"
# model = "o1-preview"
# model = "o1-mini"

# Qwen (通义千问) 模型示例
# model = "qwen-turbo"
# model = "qwen-plus"
# model = "qwen-max"
model = "qwen3.5-plus"

compressor_model = "qwen3.5-plus"

# DeepSeek 模型示例
# model = "deepseek-chat"
# model = "deepseek-coder"
# model = "deepseek-reasoner"

# GLM (智谱清言) 模型示例
# model = "glm-4-plus"
# model = "glm-4"
# model = "glm-4-flash"
# model = "glm-4-air"

# Google Gemini 模型示例
# model = "gemini-2.0-flash-exp"
# model = "gemini-1.5-pro"

# OpenRouter 模型示例
# model = "anthropic/claude-sonnet-4"
# model = "openai/gpt-4o"
# model = "deepseek/deepseek-chat"

# ====== 通用参数 ======
# max_tokens = 8192
temperature = 0.7

# ====== 工作目录 (可选) ======
# 指定工具操作的工作目录
# 可以使用相对路径或绝对路径
# 相对路径会自动转换为绝对路径
# 默认值: "." (当前目录)
# work_dir = "/home/user/projects/myproject"
work_dir = "./test"

# ====== 工具超时 (可选) ======
# 指定工具执行的超时时间（秒）
# 默认值: 120 秒
tool_timeout = 10

# ====== Extended Thinking (可选) ======
# 启用模型的推理功能（Chain of Thought）
# 不同 provider 使用不同的配置方式：
#
# 1. Anthropic Claude:
#    - 设置 thinking_enabled = true
#    - 设置 thinking_budget 为推理 token 预算（如 20000）
#    - 适用模型: claude-sonnet-4-5-20250514 等
#
# 2. OpenAI (o1 系列):
#    - 设置 thinking_enabled = true
#    - 设置 thinking_effort 为推理级别: "minimal", "low", "medium", "high"
#    - 适用模型: o1-preview, o1-mini
#
# 3. OpenRouter (推荐用于 Qwen, DeepSeek 等):
#    - 设置 thinking_enabled = true
#    - 可选设置 thinking_effort 为推理级别: "low", "medium", "high"
#    - OpenRouter 会自动传递 enable_thinking 参数给 Qwen 等模型
#
# 4. Qwen (通义千问):
#    - 注意: 直接使用 openaicompat provider 时，由于库限制无法完整支持
#    - 建议: 使用 OpenRouter provider 访问 Qwen 模型，可获得完整 thinking 支持
#    - 适用模型: qwen-max, qwen-plus, qwen-turbo 等
#
# 默认值: 全部不启用
# thinking_enabled = false
# thinking_budget = 20000       # Anthropic: token 预算
# thinking_effort = "medium"    # OpenAI/OpenRouter: 推理级别

# ====== Base URL (可选) ======
# 用于 openaicompat 或自定义 OpenAI 兼容 API
# 默认值会根据 provider 自动设置
# base_url = "https://your-custom-endpoint.com/v1"

# ====== Azure 特定配置 (仅 Azure provider 需要) ======
# azure_endpoint = "https://your-resource.openai.azure.com/"
# azure_api_version = "2024-02-01"

# ====== Bedrock 特定配置 (仅 Bedrock provider 需要) ======
# bedrock_region = "us-east-1"

# ====== Google Vertex AI 配置 (可选) ======
# google_project = "your-project-id"
# google_location = "us-central1"

# ====== Memory Service 配置 ======
# 是否启用记忆服务
# 记忆服务需要单独启动 Python 端服务 (memsvc)
memory_enabled = false

# 记忆服务 URL
# 默认值: "http://127.0.0.1:8765"
memory_service_url = "http://127.0.0.1:8765"

# memory 目录路径
# 默认值: ~/.oxencode/memory
# memory_dir = "~/.oxencode/memory"

# ====== 记忆任务监控配置 ======
# 状态轮询间隔（秒）
# 默认值: 5
# memory_monitor_poll_interval = 5

# 失败重试次数
# 默认值: 3
# memory_monitor_max_retries = 3

# 单任务监控超时（秒）
# 默认值: 600 (10分钟)
# memory_monitor_timeout = 600
