[project]
name = "memsvc"
version = "0.1.0"
description = "OxenCode Memory Service - File monitoring and metadata management"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "watchdog>=4.0.0",
    "aiosqlite>=0.19.0",
    "chromadb>=0.4.0",
    "httpx>=0.27.0",
    "langchain>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.3.0",
    "langchain-community>=0.3.0",
    "dashscope>=1.14.0",
    "jinja2>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memsvc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]